name: 'CI Pipeline'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: 'CI Pipeline - Lint & Format'
    steps:
      - name: 'Uses git-checkout'
        uses: actions/checkout@v6

      - name: 'Uses setup-node'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Run ESLint'
        run: npm run lint

      - name: 'Check Prettier formatting'
        run: npm run format:check

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    name: 'CI Pipeline - E2E Tests'
    steps:
      - name: 'Uses git-checkout'
        uses: actions/checkout@v6

      - name: 'Uses setup-node'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Install Playwright browsers'
        run: npx playwright install chromium --with-deps

      - name: 'Run E2E tests'
        run: npm test

      - name: 'Upload test report'
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build-preview:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: 'CI Pipeline - Build and push (preview)'
    steps:
      - name: 'Uses git-checkout'
        uses: actions/checkout@v6

      - name: 'Uses docker-login'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 'Uses setup QEMU'
        uses: docker/setup-qemu-action@v3

      - name: 'Uses setup docker build'
        uses: docker/setup-buildx-action@v4

      - name: 'Uses Build and push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: wundii/flowcrafter-ui:preview
          build-args: APP_VERSION=preview

  build-release:
    needs: [lint, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    name: 'CI Pipeline - Build and push (release)'
    steps:
      - name: 'Uses git-checkout'
        uses: actions/checkout@v6

      - name: 'Uses docker-login'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 'Uses setup QEMU'
        uses: docker/setup-qemu-action@v3

      - name: 'Uses setup docker build'
        uses: docker/setup-buildx-action@v4

      - name: 'Uses Build and push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            wundii/flowcrafter-ui:${{ github.ref_name }}
            wundii/flowcrafter-ui:latest
          build-args: APP_VERSION=${{ github.ref_name }}
