name: 'CI Pipeline'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: 'CI Pipeline - Lint & Format'
    steps:
      - name: 'Uses git-checkout'
        uses: actions/checkout@v4

      - name: 'Uses setup-node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Run ESLint'
        run: npm run lint

      - name: 'Check Prettier formatting'
        run: npm run format:check

  increment-version:
    if: github.event_name == 'push'
    outputs:
      VERSION: ${{ steps.increment-version.outputs.VERSION }}
    runs-on: ubuntu-latest
    name: 'CI Pipeline - Create version number'
    steps:
      - name: 'Increment version number'
        id: increment-version
        run: |
          echo VERSION=${{ github.run_number }} >> $GITHUB_OUTPUT

  build-and-push:
    needs: [lint, increment-version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: 'CI Pipeline - Build and push'
    steps:
      - name: 'Uses git-checkout'
        uses: actions/checkout@v4

      - name: 'Uses docker-login'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 'Uses setup docker build'
        uses: docker/setup-buildx-action@v3

      - name: 'Uses Build and push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: wundii/flowcrafter-ui:latest
